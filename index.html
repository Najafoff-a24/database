<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Najafoff Style</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; background-color: #f5f5f5; }
    #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; object-fit: cover; filter: blur(5px) brightness(1.5); z-index: -1; }
    .left-panel { width: 340px; background-color: rgba(34,34,34,0.9); color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .cover-container { display: flex; align-items: center; justify-content: center; position: relative; }
    .cover { width: 250px; height: 250px; background-color: #ddd; background-image: url('head.jpg'); background-size: cover; background-position: center; border-radius: 10px; margin-bottom: 8px; }
    #track-title { font-size: 16px; font-weight: bold; margin-top: 5px; text-align: center; color: #eee; }
    .volume-control { display: flex; flex-direction: column; align-items: center; margin-right: 10px; }
    .volume-control input { writing-mode: bt-lr; -webkit-appearance: slider-vertical; height: 140px; width: 6px; margin: 5px 0; }
    .volume-label { font-size: 13px; margin-top: 5px; }
    .progress-container { width: 100%; margin-top: 5px; }
    .progress-container input { width: 100%; }
    .time-display { display: flex; justify-content: space-between; font-size: 12px; margin-top: 2px; }
    .controls { display: grid; grid-template-columns: repeat(5, 55px); grid-gap: 10px; margin-top: 20px; }
    .controls button { padding: 10px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; background-color: #222; color: white; transition: background 0.3s; }
    .controls button:hover { background-color: #555; }
    .active-btn { background-color: #2ecc71 !important; color: black !important; }
    .right-panel { flex: 1; background-color: rgba(51,51,51,0.9); color: white; overflow-y: auto; padding: 20px; }
    .track-list { list-style: none; padding: 0; margin: 0; }
    .track-list li { padding: 10px; border-bottom: 1px solid #444; cursor: pointer; transition: background-color 0.3s, color 0.3s; }
    .track-list li::before { content: "🎵 "; color: #bbb; }
    .track-list li.active { background-color: #2ecc71; color: black; font-weight: bold; }
    .track-list li.active::before { color: black; }
    audio { display: none; }
  </style>
</head>
<body>

<video autoplay muted loop id="bg-video">
  <source src="videoplayback.mp4" type="video/mp4">
</video>

<div class="left-panel">
  <div class="cover-container">
    <div class="volume-control">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01">
      <div class="volume-label" id="volume-label">70%</div>
    </div>
    <div class="cover" id="cover"></div>
  </div>

  <div id="track-title"></div>

  <div class="progress-container">
    <input type="range" id="progress" value="0" step="0.1" min="0" max="100">
    <div class="time-display">
      <span id="current-time">0:00</span>
      <span id="total-time">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button onclick="playTrack()">▶️</button>
    <button onclick="pauseTrack()">⏸</button>
    <button onclick="prevTrack()">⏮</button>
    <button onclick="nextTrack()">⏭</button>
    <button id="randomBtn" onclick="toggleRandom()">🔀</button>
    <button onclick="seekBackward()">⏪</button>
    <button onclick="seekForward()">⏩</button>
    <button onclick="downloadCurrent()">⬇️</button>
    <button id="muteBtn" onclick="toggleMute()">🔊</button>
    <button id="repeatBtn" onclick="toggleRepeat()">🔁</button>
  </div>
</div>

<div class="right-panel">
  <h2>Şarkı Listesi</h2>
  <ul class="track-list" id="trackList"></ul>
</div>

<audio id="audio" controls></audio>

const audio = document.getElementById('audio');
const trackTitle = document.getElementById('track-title');
const trackListElement = document.getElementById('trackList');
const progress = document.getElementById('progress');
const volume = document.getElementById('volume');
const volumeLabel = document.getElementById('volume-label');
const currentTimeEl = document.getElementById('current-time');
const totalTimeEl = document.getElementById('total-time');
const randomBtn = document.getElementById('randomBtn');
const repeatBtn = document.getElementById('repeatBtn');

let currentTrack = 0;
let isRandom = false;
let isRepeat = false;
let trackChangeLock = false; // ← yeni eklenen kilit

// Listeyi oluştur
displayNames.forEach((name,i)=>{
  const li = document.createElement('li');
  li.textContent = name;
  li.onclick = ()=>{ currentTrack=i; loadTrack(currentTrack); };
  trackListElement.appendChild(li);
});

function loadTrack(index){
  [...trackListElement.children].forEach((el, idx)=>{
    el.classList.toggle('active', idx===index);
  });
  audio.src = tracks[index];
  trackTitle.textContent = displayNames[index];
  audio.play();
  if ('mediaSession' in navigator) updateMediaMetadata();
}

function playTrack(){ audio.play(); }
function pauseTrack(){ audio.pause(); }
function seekForward(){ audio.currentTime+=5; }
function seekBackward(){ audio.currentTime-=5; }

function safeNextTrack(){
    if(trackChangeLock) return;
    trackChangeLock = true;
    currentTrack = isRandom ? Math.floor(Math.random()*tracks.length) : (currentTrack+1)%tracks.length;
    loadTrack(currentTrack);
    setTimeout(()=>{ trackChangeLock = false; }, 300); // 0.3s kilit
}

function safePrevTrack(){
    if(trackChangeLock) return;
    trackChangeLock = true;
    currentTrack = (currentTrack-1+tracks.length)%tracks.length;
    loadTrack(currentTrack);
    setTimeout(()=>{ trackChangeLock = false; }, 300);
}

function downloadCurrent(){
  const url = tracks[currentTrack];
  const a = document.createElement('a');
  a.href = url;
  a.download = tracks[currentTrack];
  a.click();
}

function toggleEqualizer(){ alert("Equalizer simülasyonu aktif!"); }
function toggleRandom(){ isRandom=!isRandom; randomBtn.classList.toggle("active-btn",isRandom);}
function toggleRepeat(){ isRepeat=!isRepeat; audio.loop=isRepeat; repeatBtn.classList.toggle("active-btn",isRepeat);}
function formatTime(sec){ if(isNaN(sec)) return "0:00"; const m=Math.floor(sec/60); const s=Math.floor(sec%60).toString().padStart(2,"0"); return `${m}:${s}`;}

audio.addEventListener('timeupdate', ()=>{
  progress.value = (audio.currentTime/audio.duration)*100||0;
  currentTimeEl.textContent = formatTime(audio.currentTime);
  totalTimeEl.textContent = formatTime(audio.duration);
});

progress.addEventListener('input', ()=>{ audio.currentTime=(progress.value/100)*audio.duration; });

volume.addEventListener('input', ()=>{
  audio.volume = volume.value;
  volumeLabel.textContent = Math.round(volume.value*100)+"%";
});

audio.addEventListener('ended', ()=>{
    if(!isRepeat) safeNextTrack();
});

window.onload = ()=>{
  loadTrack(currentTrack);
  volume.value=0.7;
  audio.volume=0.7;
  volumeLabel.textContent="70%";
};

/* --- Klavye tuşları ile kontrol --- */
document.addEventListener('keydown', (e) => {
    switch(e.code) {
        case 'Space':
            e.preventDefault();
            audio.paused ? playTrack() : pauseTrack();
            break;
        case 'KeyR': toggleRepeat(); break;
		case 'KeyM': toggleMute(); break;
        case 'KeyS': toggleRandom(); break;
        case 'ArrowUp':
            audio.volume = Math.min(audio.volume + 0.05, 1);
            volume.value = audio.volume;
            volumeLabel.textContent = Math.round(audio.volume*100) + "%";
            break;
        case 'ArrowDown':
            audio.volume = Math.max(audio.volume - 0.05, 0);
            volume.value = audio.volume;
            volumeLabel.textContent = Math.round(audio.volume*100) + "%";
            break;
        case 'ArrowRight': seekForward(); break;
        case 'ArrowLeft': seekBackward(); break;
        case 'MediaTrackNext': safeNextTrack(); break;
        case 'MediaTrackPrevious': safePrevTrack(); break;
    }
});

/* --- Media Session API --- */
if ('mediaSession' in navigator) {
    function updateMediaMetadata() {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: displayNames[currentTrack],
            artist: 'MP3 Player',
            album: 'Çalma Listesi',
            artwork: [{ src: 'head.jpg', sizes: '250x250', type: 'image/jpeg' }]
        });
    }

    updateMediaMetadata();

    navigator.mediaSession.setActionHandler('play', playTrack);
    navigator.mediaSession.setActionHandler('pause', pauseTrack);
    navigator.mediaSession.setActionHandler('previoustrack', safePrevTrack);
    navigator.mediaSession.setActionHandler('nexttrack', safeNextTrack);
    navigator.mediaSession.setActionHandler('seekbackward', seekBackward);
    navigator.mediaSession.setActionHandler('seekforward', seekForward);

    audio.addEventListener('play', updateMediaMetadata);
    audio.addEventListener('ended', () => { if (!isRepeat) safeNextTrack(); updateMediaMetadata(); });
}

// Favori sistemi
let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

[...trackListElement.children].forEach((li, i) => {
    const star = document.createElement('span');
    star.textContent = favorites.includes(i) ? '⭐' : '☆';
    star.classList.add('favorite');
    star.style.marginRight = '5px'; // başa koyduğumuz için sağa boşluk
    star.style.cursor = 'pointer';
    
    star.onclick = (e) => {
        e.stopPropagation(); // Şarkı seçimini bozmasın
        if(favorites.includes(i)) {
            favorites = favorites.filter(x => x !== i);
            star.textContent = '☆';
        } else {
            favorites.push(i);
            star.textContent = '⭐';
        }
        localStorage.setItem('favorites', JSON.stringify(favorites));
    };
    
    li.prepend(star); // burada append yerine prepend kullanıyoruz
});

function toggleMute() {

    const muteBtn = document.getElementById('muteBtn');
    if(audio.muted){
        muteBtn.textContent = '🔇'; // Mute ikonu
        muteBtn.classList.add('active-btn'); // Buton rengini değiştir
    } else {
        muteBtn.textContent = '🔊'; // Ses ikonu
        muteBtn.classList.remove('active-btn');
    }
}

function toggleMute() {
    const muteBtn = document.getElementById('muteBtn');

    if(!audio.muted){ // Ses açıksa mute yap
        audio.muted = true;
        audio.volume = 0;
        volume.value = 0;
        volumeLabel.textContent = "0%";
        muteBtn.textContent = '🔇';
        muteBtn.classList.add('active-btn');
    } else { // Ses kapalıysa unmute yap ve varsayılan ses değerini geri getir
        audio.muted = false;
        audio.volume = 0.7; // veya istediğin varsayılan ses
        volume.value = 0.7;
        volumeLabel.textContent = "70%";
        muteBtn.textContent = '🔊';
        muteBtn.classList.remove('active-btn');
    }
}

// Slider hareketi mute'u kaldırır ve sesi ayarlar
volume.addEventListener('input', ()=>{
    if(audio.muted && volume.value > 0){ 
        audio.muted = false; // Slider hareketi unmute yapar
        const muteBtn = document.getElementById('muteBtn');
        muteBtn.textContent = '🔊';
        muteBtn.classList.remove('active-btn');
    }
    audio.volume = volume.value;
    volumeLabel.textContent = Math.round(volume.value*100)+"%";
});
